# mistral.yml — workflow Mistral : lint + tests, auto-correction (eslint --fix)
# et commit des correctifs sur la branche du déclencheur.
name: mistral

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened]   # déclenchement manuel à l'ouverture d'une issue
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numéro d'issue à traiter (optionnel)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Contexte du déclencheur
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.event.issue.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=${{ inputs.issue_number || 0 }}" >> "$GITHUB_OUTPUT"
            echo "title=" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (auto-fix)
        run: npx eslint . --fix

      - name: Commit lint fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "mistral-bot"
            git config user.email "mistral@mistral.ai"
            git commit -am "chore(mistral): auto-fix lint [skip ci]

            Generated by Mistral Vibe.
            Co-Authored-By: Mistral Vibe <vibe@mistral.ai>"
            git push
          else
            echo "aucun correctif lint"
          fi

      # Notification Studio : inutile ici, le hook GitHub 717088566 délivre déjà
      # les vrais événements signés au webhook Mistral (HTTP 202 côté Studio).

      - name: Tests e2e (générés)
        run: node --test test/e2e.test.js

      - name: Types
        run: npx tsc --noEmit --strict --skipLibCheck index.d.ts tools/*.d.ts

      - name: Lint final (bloque si erreurs restantes)
        run: npx eslint .
